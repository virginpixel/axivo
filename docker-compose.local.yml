# Local laptop testing overrides.
# Usage:
#   docker compose -p axivo-local -f docker-compose.yml -f docker-compose.local.yml up -d --build
# Runs the full production stack under the separate "axivo-local" project
# (own containers, images and volumes) with Nginx on http://localhost:8080,
# so any other Axivo deployment on this machine is left untouched.

services:
  nginx:
    ports: !override
      - "8080:80"
  web:
    environment:
      APP_URL: http://localhost:8080
  worker:
    environment:
      APP_URL: http://localhost:8080
  migrate:
    environment:
      APP_URL: http://localhost:8080
