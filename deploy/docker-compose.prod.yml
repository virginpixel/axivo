# =============================================================================
# Axivo - self-host production stack (prebuilt images from GHCR).
#
# This file is used by install.sh on the target VM. Unlike the repo-root
# docker-compose.yml (which BUILDS images locally for development), this one
# PULLS prebuilt images, so a fresh VM needs no build toolchain:
#
#   docker compose -f deploy/docker-compose.prod.yml pull
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# ${AXIVO_VERSION} and ${POSTGRES_PASSWORD} are read from the .env file that
# install.sh writes next to this compose file.
# =============================================================================

name: axivo

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy_params_axivo:/etc/nginx/proxy_params_axivo:ro
      # TLS (self-signed or Let's Encrypt) is layered on in a later phase.
      # - ./certs:/etc/nginx/certs:ro
    networks: [frontend]

  web:
    image: ghcr.io/virginpixel/axivo-web:${AXIVO_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://axivo:${POSTGRES_PASSWORD}@postgres:5432/axivo?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_PATH: /var/lib/axivo/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - storage:/var/lib/axivo/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [frontend, backend]

  worker:
    image: ghcr.io/virginpixel/axivo-worker:${AXIVO_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://axivo:${POSTGRES_PASSWORD}@postgres:5432/axivo?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_PATH: /var/lib/axivo/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - storage:/var/lib/axivo/storage
    networks: [frontend, backend]

  # One-shot: applies Prisma migrations and the idempotent system seed on every
  # deploy/update. Data lives in the pgdata volume, so this never destroys it.
  migrate:
    image: ghcr.io/virginpixel/axivo-worker:${AXIVO_VERSION:-latest}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://axivo:${POSTGRES_PASSWORD}@postgres:5432/axivo?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_PATH: /var/lib/axivo/storage
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    networks: [backend]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: axivo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: axivo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axivo -d axivo"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

volumes:
  pgdata:
  redisdata:
  storage:

networks:
  frontend:
  backend:
    internal: true
