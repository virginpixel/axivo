# =============================================================================
# Axivo - self-host production stack (prebuilt images from GHCR).
#
# This file is used by install.sh on the target VM. Unlike the repo-root
# docker-compose.yml (which BUILDS images locally for development), this one
# PULLS prebuilt images, so a fresh VM needs no build toolchain:
#
#   docker compose -f deploy/docker-compose.prod.yml pull
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# ${AXIVO_VERSION} and ${POSTGRES_PASSWORD} are read from the .env file that
# install.sh writes next to this compose file.
# =============================================================================

name: axivo

services:
  # Edge proxy. Serves plain HTTP by default; the in-app tunnel setup swaps in
  # Caddyfile.https and reloads to obtain a real cert via Cloudflare DNS-01.
  caddy:
    image: ghcr.io/virginpixel/axivo-caddy:${AXIVO_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Populated only when HTTPS is enabled; ignored by the HTTP Caddyfile.
      AXIVO_DOMAIN: ${AXIVO_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [frontend]

  web:
    image: ghcr.io/virginpixel/axivo-web:${AXIVO_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://axivo:${POSTGRES_PASSWORD}@postgres:5432/axivo?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_PATH: /var/lib/axivo/storage
      # Reach the update agent over the internal network with the shared secret.
      AGENT_URL: http://agent:8099
      AGENT_SECRET: ${AGENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - storage:/var/lib/axivo/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [frontend, backend]

  worker:
    image: ghcr.io/virginpixel/axivo-worker:${AXIVO_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://axivo:${POSTGRES_PASSWORD}@postgres:5432/axivo?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_PATH: /var/lib/axivo/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - storage:/var/lib/axivo/storage
    networks: [frontend, backend]

  # One-shot: applies Prisma migrations and the idempotent system seed on every
  # deploy/update. Data lives in the pgdata volume, so this never destroys it.
  migrate:
    image: ghcr.io/virginpixel/axivo-worker:${AXIVO_VERSION:-latest}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://axivo:${POSTGRES_PASSWORD}@postgres:5432/axivo?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_PATH: /var/lib/axivo/storage
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    networks: [backend]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: axivo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: axivo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axivo -d axivo"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  # Privileged update helper. Reachable only from the web container on the
  # internal network, secret-gated. Mounts the Docker socket and the install
  # directory so it can run `docker compose` against this same project. Runs the
  # database backup + pull + recreate on a one-click update.
  agent:
    image: ghcr.io/virginpixel/axivo-agent:${AXIVO_VERSION:-latest}
    restart: unless-stopped
    environment:
      AGENT_SECRET: ${AGENT_SECRET:-}
      AXIVO_INSTALL_DIR: /opt/axivo
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AXIVO_INSTALL_DIR:-/opt/axivo}:/opt/axivo
    networks: [frontend]

  # Cloudflare Tunnel connector for remote access. Only runs when the "tunnel"
  # profile is active (the in-app tunnel setup starts it via the agent). It
  # connects outbound to Cloudflare - no inbound ports - and forwards the public
  # hostname to caddy per the tunnel's dashboard configuration.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks: [frontend]

volumes:
  pgdata:
  redisdata:
  storage:
  caddydata:
  caddyconfig:

networks:
  frontend:
  backend:
    internal: true
