# =============================================================================
# Axivo reverse proxy (SDS Doc 02 Ch10, Doc 05 Ch12)
# Responsibilities: HTTPS termination, security headers, request routing,
# compression, upload limits. When running behind Cloudflare Tunnel, keep only
# the port-80 server block and point the tunnel at nginx.
# =============================================================================

# Rate limit zone for the public request endpoints (defense in depth; the
# application also enforces per-IP business limits).
limit_req_zone $binary_remote_addr zone=axivo_public:10m rate=30r/m;

# Docker's embedded DNS. Without this, nginx resolves "web" once at startup and
# caches the container IP forever, so every redeploy of the web service leaves
# nginx proxying to a dead address and returning 502 until it is restarted.
# Pairing it with a variable in proxy_pass (see $axivo_web below) defers
# resolution to request time, so a rebuilt web container is picked up on its own.
# Outside Docker Compose, point this at the host resolver instead.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name _;

    # If serving TLS directly, uncomment the redirect and the 443 block below.
    # return 301 https://$host$request_uri;

    client_max_body_size 30m;

    # Held in a variable on purpose: it forces nginx to re-resolve "web" at
    # request time rather than pinning the IP from startup.
    set $axivo_web "web:3000";

    # Relative redirects preserve the externally visible host:port when the
    # proxy is published on a non-standard port.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers (also set by the application; duplicated here so static
    # assets are covered even when served directly).
    # SAMEORIGIN so first-party PDF previews can be embedded by the app itself.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Rate limit only the genuinely public surfaces. These are EXACT/scoped
    # matches on purpose: a bare "location /r" prefix also catches /requests and
    # /reports, whose RSC prefetches then trip the public limiter and 503. The
    # portal (/requests, /reports, ...) must fall through to "location /".

    # The public form index, which redirects to "/".
    location = /r {
        limit_req zone=axivo_public burst=10 nodelay;
        proxy_pass http://$axivo_web;
        include /etc/nginx/proxy_params_axivo;
    }

    # Individual public request forms at /r/<slug>.
    location /r/ {
        limit_req zone=axivo_public burst=10 nodelay;
        proxy_pass http://$axivo_web;
        include /etc/nginx/proxy_params_axivo;
    }

    # Public secure-token pages (approval, credentials, handover, correction).
    location /action/ {
        limit_req zone=axivo_public burst=10 nodelay;
        proxy_pass http://$axivo_web;
        include /etc/nginx/proxy_params_axivo;
    }

    location / {
        proxy_pass http://$axivo_web;
        include /etc/nginx/proxy_params_axivo;
    }
}

