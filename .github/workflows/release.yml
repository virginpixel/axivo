# Build and publish the Axivo web + worker images to GitHub Container Registry.
# Triggered by pushing a semver tag (e.g. v1.2.0) or manually. The install.sh
# on a customer VM pulls these prebuilt images, so nobody has to build on the VM.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v1.0.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            target: web
            image: axivo-web
          - dockerfile: Dockerfile
            target: worker
            image: axivo-worker
          - dockerfile: Dockerfile.caddy
            target: ""
            image: axivo-caddy
          - dockerfile: Dockerfile.agent
            target: ""
            image: axivo-agent
    steps:
      - uses: actions/checkout@v4

      # Derive the version from the tag (push) or the manual input.
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          # Attestations need id-token/attestations permissions we don't grant
          # (and aren't needed for a self-host product); disabling avoids a push
          # failure on the default GITHUB_TOKEN scopes.
          provenance: false
          sbom: false
          build-args: |
            AXIVO_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest

  # Publish a GitHub Release for the tag once all images are up, so the in-app
  # "check for updates" has a real latest-release version to compare against.
  release:
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
